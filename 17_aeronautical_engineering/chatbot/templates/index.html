<body>
<noscript><div style="padding:16px;margin:16px;border-radius:10px;background:#fff3cd;color:#664d03;font-family:Arial,sans-serif">JavaScript is required for the chatbot interface.</div></noscript>
<
<script>
const form=document.getElementById("form"), input=document.getElementById("input"), chat=document.getElementById("chat");
const history=[];
function add(role,text,extra=""){const d=document.createElement("div");d.className=`msg ${role} ${extra}`;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
add("bot","Hello! I’m your dedicated academic tutor. Ask me anything related to this study domain.");
form.addEventListener("submit",async e=>{
 e.preventDefault(); const message=input.value.trim(); if(!message)return;
 add("user",message); input.value=""; const typing=add("bot","Thinking…","typing");
 try{
   const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history})});
   const data=await r.json(); typing.remove();
   if(!r.ok) throw new Error(data.error||"Request failed.");
   add("bot",data.answer); history.push({role:"user",content:message},{role:"assistant",content:data.answer});
 }catch(err){typing.remove();add("error",err.message||"Unable to generate a response.");}
});
</script>
